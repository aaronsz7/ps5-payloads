name: Automated PS5 Payload Hub
on:
  schedule:
    - cron: '0 */6 * * *' # Automatically checks for updates every 6 hours
  workflow_dispatch: # Manual run button

jobs:
  sync-payloads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ========================================================
      # 1. FETCH DATA FOR: PS5 Game Compressor (by keieksof)
      # ========================================================
      - name: Get Game Compressor Details
        id: fetch_compressor
        run: |
          # Querying the list of releases to safely bypass missing "latest" tags
          API_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://github.com)
          
          # Safely pull the top index tag and asset link
          VERSION_TAG=$(echo "$API_DATA" | jq -r '.[0].tag_name')
          DOWNLOAD_LINK=$(echo "$API_DATA" | jq -r '.[0].assets[] | select(.name == "game-compressor.elf") | .browser_download_url')
          
          echo "COMP_VER=${VERSION_TAG}" >> $GITHUB_ENV
          echo "COMP_URL=${DOWNLOAD_LINK}" >> $GITHUB_ENV

      # ========================================================
      # 2. GENERATING YOUR TARGET JSON FILE
      # ========================================================
      - name: Compile Payloads Database
        run: |
          cat << 'EOF' > payloads.json
          {
            "payloads": [
              {
                "name": "PS5 Game Compressor",
                "version": "${{ env.COMP_VER }}",
                "url": "${{ env.COMP_URL }}",
                "description": "Progress-aware game compression utility for PS5 storage space management."
              }
            ]
          }
          EOF

      # ========================================================
      # 3. SAVE CHANGES BACK TO YOUR REPOSITORY
      # ========================================================
      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Update Bot"
          git config --global user.email "actions@github.com"
          git add payloads.json
          git diff-index --quiet HEAD || (git commit -m "System auto-update: Payloads synchronized" && git push)
